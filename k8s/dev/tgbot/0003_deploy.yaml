apiVersion: apps/v1
kind: Deployment

metadata:
  name: tgbot
  namespace: dev

spec:
  replicas: 1
  selector:
    matchLabels:
      app: tgbot
  template:
    metadata:
      namespace: dev
      labels:
        app: tgbot
    spec:
      containers:
        - image: registry.gitlab.com/echo-public/echo/bot:0.1.3
          imagePullPolicy: Always
          ports:
            - name: webhook-port
              containerPort: 8080
              protocol: TCP
            - name: metrics-port
              containerPort: 9090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: tgbot-config
            - secretRef:
                name: tgbot-secret
      imagePullSecrets:
        - name: gitlab-registry