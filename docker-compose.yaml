services:
  # infrastructure
  s3:
    image: minio/minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web interface
    environment:
      MINIO_ROOT_USER: moonfire
      MINIO_ROOT_PASSWORD: moonfire
      MINIO_BUCKETS: audio-raw
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    ports:
      - "5432:5432"
    healthcheck:
      test: "psql -U postgres -d postgres -c \"SELECT 1;\""
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - '6379:6379'
  kafka:
    image: apache/kafka:latest
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=DOCKER://:9092,LOCAL://:9093,CONTROLLER://:9094
      - KAFKA_ADVERTISED_LISTENERS=DOCKER://host.docker.internal:9092,LOCAL://localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,LOCAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9094
      - KAFKA_INTER_BROKER_LISTENER_NAME=DOCKER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
    ports:
      - '9092:9092'
      - '9093:9093'
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_BASE_URL} tg-bot:8080
    depends_on:
      - tg-bot

  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # actual services
  tgdb:
    image: registry.gitlab.com/echo-public/echo/tgdb:0.1.2
    build:
      context: ./services/tgdb
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: default

      JAEGER_ENDPOINT: jaeger:4318
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    ports:
      - '50051:50051'
  tg-bot:
    image: registry.gitlab.com/echo-public/echo/bot:0.1.2
    build:
      context: ./services/bot
    environment:
      S3_ACCESS_KEY_ID: moonfire
      S3_SECRET_ACCESS_KEY: moonfire
      S3_URL: http://s3:9000

      TGDB_HOST: tgdb
      TGDB_PORT: 50051

      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
      KAFKA_CONSUMER_GROUP: tg_bot

      DEFAULT_LOCALE: en

      BOT_TOKEN: "${BOT_TOKEN}"
      BOT_API_MODE: "webhook"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
    depends_on:
      tgdb:
        condition: service_started
      s3:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - '9090:9090'
  audio-preprocessor:
    image: registry.gitlab.com/echo-public/echo/preprocessor:0.1.0
    build:
      context: ./services/preprocessor
    environment:
      S3_ACCESS_KEY_ID: moonfire
      S3_SECRET_ACCESS_KEY: moonfire
      S3_URL: http://s3:9000

      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
      KAFKA_CONSUMER_GROUP: tg_bot
    depends_on:
      s3:
        condition: service_healthy
      kafka:
        condition: service_started
  transcriber:
    image: registry.gitlab.com/echo-public/echo/transcriber:0.1.2
    build:
      context: ./services/transcriber
    environment:
      MODEL: ${WHISPER_MODEL:-base}

      S3_ACCESS_KEY_ID: moonfire
      S3_SECRET_ACCESS_KEY: moonfire
      S3_URL: http://s3:9000

      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
      KAFKA_CONSUMER_GROUP: tg_bot
    depends_on:
      s3:
        condition: service_healthy
      kafka:
        condition: service_started